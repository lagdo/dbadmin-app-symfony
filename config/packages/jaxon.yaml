parameters:
    jaxon:
        app:
            metadata:
                cache:
                    enabled: true
                    dir: '%kernel.project_dir%/var/dbadmin'
            assets:
                export: true
                minify: true
                uri: /jaxon/app-0.15.0
                dir: '%kernel.project_dir%/public/jaxon/app-0.15.0'
                # file' => '',
                include:
                    dialog_code: false
            dialogs:
                # The dialogs libraries are defined in the dbadmin/services/template.php file.
                lib:
                    use: [bootstrap5, bulma, sweetalert, cute, notyf]
            storage:
                stores:
            upload:
                enabled: false

        lib:
            core:
                debug:
                    on: false
                    verbose: false
                # request:
                #     uri: "/jaxon"
                prefix:
                    class: ""
                error:
                    handle: false
            js:
                lib:
                    uri: '/jaxon/lib-5.2.5'
