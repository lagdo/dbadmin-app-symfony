parameters:
    jaxon:
        app:
            metadata:
                cache:
                    enabled: true
                    dir: '%kernel.project_dir%/var/dbadmin'
            assets:
                export: true
                minify: true
                uri: /jaxon/app-0.14.0
                dir: '%kernel.project_dir%/public/jaxon/app-0.14.0'
                # file' => '',
                include:
                    dialog_code: false
            dialogs:
                # Defined in the services/template.php file.
                lib:
                    use: [bootstrap5, bulma, sweetalert, notyf]
            storage:
                stores:
                    uploads:
                        adapter: local
                        dir: '%kernel.project_dir%/var/uploads'
                    exports:
                        adapter: local
                        dir: '%kernel.project_dir%/var/exports'
            uploads:
                enabled: true
                files:
                    sql_files:
                        storage: uploads

        lib:
            core:
                debug:
                    on: false
                    verbose: false
                # request:
                #     uri: "/jaxon"
                prefix:
                    class: ""
                error:
                    handle: false
            js:
                lib:
                    uri: '/jaxon/lib-5.2.5'
